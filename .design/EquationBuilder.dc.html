<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
  <style>
    body { margin: 0; font-family: "Inter", system-ui, -apple-system, sans-serif; font-size: 14px; color: #0f172a; background: #f8fafc; -webkit-font-smoothing: antialiased; }
    a { color: #6d28d9; } a:hover { color: #5b21b6; }
    .serif { font-family: Georgia, "Times New Roman", serif; }
    .palbtn { display: flex; align-items: center; justify-content: center; height: 46px; border: 1px solid #e2e8f0; border-radius: 8px; background: #ffffff; color: #0f172a; }
    .palgroup { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #94a3b8; }
  </style>
</helmet>
<div style="width: 1100px; height: 780px; background: #475569; display: flex; align-items: center; justify-content: center; box-sizing: border-box; padding: 26px">

  <div style="width: 100%; background: #ffffff; border: 1px solid #cbd5e1; border-radius: 14px; box-shadow: 0 4px 6px -1px rgba(15,23,42,0.05), 0 10px 15px -3px rgba(15,23,42,0.18); display: flex; flex-direction: column; overflow: hidden">

    <div style="display: flex; align-items: center; gap: 10px; padding: 15px 20px; border-bottom: 1px solid #e2e8f0">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6d28d9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h6M7 5v14"></path><path d="M14 8h6M14 16h6"></path></svg>
      <span style="font-size: 15.5px; font-weight: 700">Equation</span>
      <div style="flex-grow: 1"></div>
      <span style="font-size: 12px; color: #94a3b8">Click a shape, then type into the boxes</span>
    </div>

    <div style="padding: 26px 24px; display: flex; flex-direction: column; align-items: center; gap: 8px; background: #f8fafc; border-bottom: 1px solid #e2e8f0">
      <span style="font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #94a3b8; align-self: flex-start">Your equation</span>
      <div style="width: 100%; min-height: 140px; background: #ffffff; border: 2px solid #6d28d9; border-radius: 10px; box-shadow: 0 0 0 3px rgba(109,40,217,0.12); display: flex; align-items: center; justify-content: center; gap: 14px; padding: 20px">
        <span class="serif" style="font-size: 30px; font-style: italic">A</span>
        <span class="serif" style="font-size: 30px">=</span>
        <div style="display: flex; align-items: stretch; gap: 6px">
          <div style="width: 12px; border: 2px solid #0f172a; border-right: none; border-radius: 3px 0 0 3px"></div>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
            <div style="width: 46px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 6px; background: #f1f5f9; font-size: 20px" class="serif">1</div>
            <div style="width: 46px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 6px; background: #f1f5f9; font-size: 20px" class="serif">2</div>
            <div style="width: 46px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 6px; background: #f1f5f9; font-size: 20px" class="serif">3</div>
            <div style="width: 46px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 6px; background: #ffffff; border: 2px dashed #6d28d9"><span style="width: 1.5px; height: 22px; background: #6d28d9"></span></div>
          </div>
          <div style="width: 12px; border: 2px solid #0f172a; border-left: none; border-radius: 0 3px 3px 0"></div>
        </div>
      </div>
      <span style="font-size: 12px; color: #64748b; align-self: flex-start">Tab moves to the next box · the dashed box is where you are typing</span>
    </div>

    <div style="padding: 18px 24px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; flex-direction: column; gap: 9px">
        <span class="palgroup">Structures</span>
        <div style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 9px">
          <div class="palbtn"><div style="display: flex; flex-direction: column; align-items: center"><span style="width: 20px; height: 9px; border-bottom: 2px solid #0f172a"></span><span style="width: 20px; height: 9px"></span></div></div>
          <div class="palbtn"><span class="serif" style="font-size: 17px">x<sup style="font-size: 11px">n</sup></span></div>
          <div class="palbtn"><span class="serif" style="font-size: 17px">x<sub style="font-size: 11px">n</sub></span></div>
          <div class="palbtn"><span class="serif" style="font-size: 19px">√</span></div>
          <div class="palbtn" style="border-color: #ddd6fe; background: #f5f3ff"><span class="serif" style="font-size: 17px; color: #6d28d9">[ ]</span></div>
          <div class="palbtn"><span class="serif" style="font-size: 17px">| |</span></div>
          <div class="palbtn"><span class="serif" style="font-size: 19px">∫</span></div>
          <div class="palbtn"><span class="serif" style="font-size: 19px">∑</span></div>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 9px">
        <span class="palgroup">Calculus &amp; symbols</span>
        <div style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 9px">
          <div class="palbtn"><span style="font-size: 13px; font-weight: 600">lim</span></div>
          <div class="palbtn"><span class="serif" style="font-size: 17px">dy/dx</span></div>
          <div class="palbtn"><span class="serif" style="font-size: 18px">θ</span></div>
          <div class="palbtn"><span class="serif" style="font-size: 18px">π</span></div>
          <div class="palbtn"><span class="serif" style="font-size: 18px">∞</span></div>
          <div class="palbtn"><span class="serif" style="font-size: 18px">≤</span></div>
          <div class="palbtn"><span class="serif" style="font-size: 18px">≥</span></div>
          <div class="palbtn"><span class="serif" style="font-size: 18px">≠</span></div>
        </div>
      </div>
    </div>

    <div style="padding: 12px 24px; border-top: 1px solid #e2e8f0; background: #f8fafc; display: flex; align-items: center; gap: 10px">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
      <span style="font-size: 12.5px; font-weight: 600; color: #64748b">Advanced</span>
      <span style="font-size: 12px; color: #94a3b8">— type LaTeX directly, for anything the palette doesn't cover</span>
      <div style="flex-grow: 1"></div>
      <button style="padding: 8px 14px; font: inherit; font-size: 13px; font-weight: 600; color: #475569; background: #ffffff; border: 1px solid #cbd5e1; border-radius: 8px; cursor: pointer">Cancel</button>
      <button style="padding: 8px 18px; font: inherit; font-size: 13px; font-weight: 600; color: #fff; background: #6d28d9; border: 1px solid transparent; border-radius: 8px; cursor: pointer">Insert</button>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
