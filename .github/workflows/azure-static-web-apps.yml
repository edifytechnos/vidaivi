name: Deploy to Azure Static Web Apps

# Two deploy jobs, deliberately not one with a conditional environment: a push
# to main goes to production and must never be able to land anywhere else.
#
# Both fire on PUSH, and there is no pull_request trigger. That is not a style
# choice: on a pull_request event the deploy action derives the environment from
# the PR number and ignores `deployment_environment`, so the named QA
# environment is only reachable from a branch push. Microsoft's own example
# pairs `deployment_environment` with a push-on-branches trigger.
on:
  push:
    branches: ["**"]
  # Closing a PR still has to free its environment: the Free plan allows only
  # THREE staging environments per app, and the fourth does not fail loudly —
  # it half-serves, answering some requests with Azure's own 404. This trigger
  # runs the cleanup job only; it never deploys.
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      close_environment:
        description: "Name of a staging environment to close (frees a slot)"
        required: false
        type: string

jobs:
  production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    name: Build and deploy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install and build
        env:
          VITE_APPINSIGHTS_CONNECTION_STRING: ${{ secrets.APPINSIGHTS_CONNECTION_STRING }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          npm ci
          npm run build

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist
          api_location: api
          skip_app_build: true

  # Every branch but main deploys to ONE named environment with a stable URL,
  # rather than a per-PR one. Google sign-in is bound to an origin, so a URL that changes with
  # the PR number cannot be signed in to — a QA site nobody can log into is not
  # a QA site. The hostname below is the only extra origin on the OAuth client.
  #
  # The trade: one branch under test at a time, since they share the
  # environment; the newest push wins.
  # Azure's Free plan allows 3 named environments per app if that ever needs to
  # become two. A custom domain cannot be used here — Azure does not support
  # custom domains on preview environments, only on an app's production one.
  qa:
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    name: Build and deploy to QA
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install and build
        env:
          VITE_APPINSIGHTS_CONNECTION_STRING: ${{ secrets.APPINSIGHTS_CONNECTION_STRING }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          npm ci
          npm run build

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist
          api_location: api
          skip_app_build: true
          deployment_environment: qa

  # Free a staging environment slot: automatically when a PR closes, or by hand
  # via workflow_dispatch when a stale one needs clearing.
  close_environment:
    if: github.event_name == 'pull_request' || inputs.close_environment != ''
    runs-on: ubuntu-latest
    name: Close a staging environment
    steps:
      - name: Close
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
          deployment_environment: ${{ inputs.close_environment || github.event.number }}
