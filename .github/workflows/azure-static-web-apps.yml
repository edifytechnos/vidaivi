name: Deploy to Azure Static Web Apps

# Two deploy jobs, deliberately not one with a conditional environment: a push
# to main goes to production and must never be able to land anywhere else.
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

jobs:
  production:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    name: Build and deploy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install and build
        env:
          VITE_APPINSIGHTS_CONNECTION_STRING: ${{ secrets.APPINSIGHTS_CONNECTION_STRING }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          npm ci
          npm run build

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist
          api_location: api
          skip_app_build: true

  # Every PR deploys to ONE named environment with a stable URL, rather than a
  # per-PR one. Google sign-in is bound to an origin, so a URL that changes with
  # the PR number cannot be signed in to — a QA site nobody can log into is not
  # a QA site. The hostname below is the only extra origin on the OAuth client.
  #
  # The trade: one PR under test at a time, since they share the environment.
  # Azure's Free plan allows 3 named environments per app if that ever needs to
  # become two. A custom domain cannot be used here — Azure does not support
  # custom domains on preview environments, only on an app's production one.
  qa:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: Build and deploy to QA
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install and build
        env:
          VITE_APPINSIGHTS_CONNECTION_STRING: ${{ secrets.APPINSIGHTS_CONNECTION_STRING }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          npm ci
          npm run build

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist
          api_location: api
          skip_app_build: true
          deployment_environment: qa
