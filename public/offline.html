<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>Vidai — Offline</title>
    <!-- Served by sw.js when there is no network at all. No script, no
         font, no image file: the worker caches this one page and nothing
         else, so it has to render with nothing but itself. -->
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f8fafc;
        color: #0f172a;
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main {
        max-width: 340px;
        padding: 32px 24px;
        text-align: center;
      }
      h1 {
        font-size: 20px;
        margin: 16px 0 8px;
      }
      p {
        color: #475569;
        margin: 0 0 24px;
      }
      a {
        display: inline-block;
        padding: 12px 24px;
        border-radius: 8px;
        background: #6d28d9;
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 512 512" width="64" height="64" aria-hidden="true">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6d28d9"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs>
        <rect width="512" height="512" rx="112" fill="url(#g)"/>
        <path d="M158 160 256 362 354 160" fill="none" stroke="#fff" stroke-width="66" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h1>You are offline</h1>
      <p>Vidai needs the internet to load your tests. Your saved answers are safe; connect and try again.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
